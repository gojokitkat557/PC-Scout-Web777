<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>PC Scout Web</title><style>
:root{--bg:#080a0f;--panel:#10141d;--line:rgba(255,255,255,.08);--text:#f5f7ff;--muted:#939caf;--accent:#8b73ff;--good:#55d99d;--warn:#efbd62}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -160px,rgba(139,115,255,.18),transparent 70%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.top{position:sticky;top:0;z-index:30;background:rgba(8,10,15,.96);border-bottom:1px solid var(--line);padding:10px 12px}.topin{max-width:1250px;margin:auto;display:flex;gap:10px;align-items:center}.logo{font-weight:950}.logo b{color:#a28eff}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);background:#121722;color:#fff;border-radius:10px;padding:9px 11px}.primary{background:linear-gradient(135deg,#6650e6,#8c75ff);border-color:transparent}main{max-width:1250px;margin:auto;padding:14px}.hero{border:1px solid var(--line);background:linear-gradient(145deg,#121722,#0d121a);border-radius:18px;padding:16px}.hero h1{font-size:22px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.kpi{padding:11px;border:1px solid var(--line);border-radius:13px;background:#0d121b}.kpi small{color:var(--muted);font-size:10px}.kpi b{display:block;margin-top:5px}.toolbar{position:sticky;top:59px;z-index:20;margin:10px 0;padding:7px;border:1px solid var(--line);background:rgba(10,13,20,.97);border-radius:13px;display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,auto);gap:6px}.toolbar input,.toolbar select{min-height:39px;background:#0b1018;color:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.changes{display:none;margin:9px 0;padding:10px 12px;border:1px solid rgba(139,115,255,.25);background:rgba(139,115,255,.08);border-radius:12px;font-size:12px}.changes.show{display:block}.list{display:grid;gap:8px}.pc{border:1px solid var(--line);background:linear-gradient(145deg,#111722,#0d121a);border-radius:15px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;overflow:hidden}.rank{display:grid;place-items:center;border-right:1px solid var(--line);font-weight:900;color:#c8bfff;background:rgba(139,115,255,.06)}.body{padding:11px;min-width:0}.head{display:flex;gap:8px;justify-content:space-between}.title{font-weight:850}.sub{color:var(--muted);font-size:11px;margin-top:2px}.price{font-weight:900;font-size:18px;color:var(--good);white-space:nowrap}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.chip{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.notes{margin-top:7px;color:#aab2c2;font-size:11px}.actions{padding:9px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px}.actions a{text-decoration:none;text-align:center}.empty{text-align:center;color:var(--muted);padding:40px 10px}@media(max-width:760px){.status{display:none}.top{padding:8px}.hero{padding:12px}.hero h1{font-size:17px}.kpis{display:flex;overflow:auto;gap:6px}.kpi{flex:0 0 72%;max-width:250px}.toolbar{top:51px;grid-template-columns:1fr;margin:8px 0}.toolbar select{display:block}.pc{grid-template-columns:34px minmax(0,1fr)}.body{padding:9px}.actions{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:7px}.title{font-size:12px}.sub{font-size:10px}.price{font-size:16px}.notes{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.chips{flex-wrap:nowrap;overflow:auto}.chip{flex:0 0 auto}}
</style></head><body><header class="top"><div class="topin"><div class="logo">PC <b>SCOUT</b></div><div id="updated" class="status">Cargando…</div><div class="spacer"></div><button id="favBtn" class="btn">Favoritos</button><button id="refreshBtn" class="btn primary">Actualizar ahora</button></div></header><main><section class="hero"><h1>PCs gaming · 600–700 €</h1><p>Los anuncios están separados del HTML: esta página siempre lee pcs.json.</p><div class="kpis"><div class="kpi"><small>Activos</small><b id="kActive">—</b></div><div class="kpi"><small>Mejor opción</small><b id="kBest">—</b></div><div class="kpi"><small>Precio medio</small><b id="kAvg">—</b></div><div class="kpi"><small>Cambios</small><b id="kChanges">0</b></div></div></section><div id="changes" class="changes"></div><div class="toolbar"><input id="q" placeholder="Buscar CPU, GPU, fuente…"><select id="sort"><option value="score">Mejor puntuación</option><option value="price">Menor precio</option><option value="confidence">Mayor confianza</option></select><select id="risk"><option value="">Todos los riesgos</option><option value="low">Bajo</option><option value="low-medium">Bajo-medio</option><option value="medium">Medio</option></select><select id="ship"><option value="">Todo</option><option value="yes">Con envío confirmado</option></select></div><div id="list" class="list"></div></main><script>
const state={data:null,showFav:false};const $=s=>document.querySelector(s);const favs=()=>new Set(JSON.parse(localStorage.getItem('pcscout-favs')||'[]'));function setFav(id,on){let f=favs();on?f.add(id):f.delete(id);localStorage.setItem('pcscout-favs',JSON.stringify([...f]));render()}function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n)}function fmt(x){try{return new Date(x).toLocaleString('es-ES')}catch{return x}}async function load(force=false){const s=force?'?t='+Date.now():'';state.data=await fetch('./pcs.json'+s,{cache:force?'no-store':'default'}).then(r=>r.json());detect();render()}function detect(){const old=JSON.parse(localStorage.getItem('pcscout-snapshot')||'{}'),now={};let c=[];for(const p of state.data.items){now[p.id]={price:p.price,status:p.status,title:p.title};if(old[p.id]){if(old[p.id].price!==p.price)c.push(`${p.title}: ${money(old[p.id].price)} → ${money(p.price)}`);if(old[p.id].status!==p.status)c.push(`${p.title}: ${old[p.id].status} → ${p.status}`)}else if(Object.keys(old).length)c.push(`Nuevo: ${p.title}`)}for(const [id,v] of Object.entries(old))if(!now[id])c.push(`Retirado: ${v.title||id}`);localStorage.setItem('pcscout-snapshot',JSON.stringify(now));$('#kChanges').textContent=c.length;$('#changes').classList.toggle('show',c.length>0);$('#changes').innerHTML=c.length?'<b>Cambios desde la última visita</b><br>'+c.map(x=>'• '+x).join('<br>'):''}function filtered(){let a=state.data.items.filter(p=>p.status==='active'&&p.price>=600&&p.price<=700),q=$('#q').value.toLowerCase(),r=$('#risk').value,s=$('#ship').value;if(state.showFav){let f=favs();a=a.filter(p=>f.has(p.id))}if(q)a=a.filter(p=>JSON.stringify(p).toLowerCase().includes(q));if(r)a=a.filter(p=>p.risk===r);if(s==='yes')a=a.filter(p=>p.shipping===true);let so=$('#sort').value;if(so==='price')a.sort((x,y)=>x.price-y.price);else if(so==='confidence')a.sort((x,y)=>y.confidence-x.confidence);else a.sort((x,y)=>y.score-x.score||x.price-y.price);return a.slice(0,50)}function render(){if(!state.data)return;const a=filtered(),f=favs();$('#updated').textContent='Actualizado '+fmt(state.data.updated_at);$('#kActive').textContent=a.length;$('#kBest').textContent=a[0]?.gpu||'—';$('#kAvg').textContent=a.length?money(Math.round(a.reduce((s,p)=>s+p.price,0)/a.length)):'—';$('#favBtn').textContent=state.showFav?'Ver todos':'Favoritos';$('#list').innerHTML=a.length?a.map((p,i)=>`<article class="pc"><div class="rank">#${i+1}</div><div class="body"><div class="head"><div><div class="title">${p.title}</div><div class="sub">${p.cpu} · ${p.gpu}</div></div><div class="price">${money(p.price)}</div></div><div class="chips"><span class="chip">${p.score}/100</span><span class="chip">${p.confidence}% confianza</span><span class="chip">Riesgo ${p.risk}</span><span class="chip">${p.shipping===true?'Envío confirmado':'Envío por confirmar'}</span><span class="chip">${p.psu}</span></div><div class="notes">${p.notes.map(n=>'• '+n).join(' &nbsp; ')}</div></div><div class="actions"><button class="btn" onclick="setFav('${p.id}',${!f.has(p.id)})">${f.has(p.id)?'♥ Favorito':'♡ Favorito'}</button>${p.url?`<a class="btn primary" target="_blank" rel="noopener" href="${p.url}">Wallapop</a>`:`<button class="btn primary" disabled>Sin enlace</button>`}</div></article>`).join(''):'<div class="empty">No hay PCs que coincidan con los filtros.</div>'}['q','sort','risk','ship'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));$('#favBtn').onclick=()=>{state.showFav=!state.showFav;render()};$('#refreshBtn').onclick=async()=>{const b=$('#refreshBtn');b.disabled=true;b.textContent='Actualizando…';try{await load(true)}finally{b.disabled=false;b.textContent='Actualizar ahora'}};load(true).catch(e=>{$('#list').innerHTML='<div class="empty">No se pudo cargar pcs.json. Abre la web mediante GitHub Pages, no como archivo local.</div>';console.error(e)});
</script></body></html>
